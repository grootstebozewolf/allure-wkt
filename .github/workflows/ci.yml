name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 20 is EOL April 2026 (LTS schedule) and the GH Actions
        # runtime drops Node 20 actions in Sept 2026, so we test 22 LTS
        # and current 24. Drop 22 once the LTS line moves on.
        node-version: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dev dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test
